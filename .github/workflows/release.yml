name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore NuGet packages (4RTools)
        run: nuget restore 4RTools.csproj -PackagesDirectory packages

      - name: Restore NuGet packages (Tests)
        run: dotnet restore tests/4RTools.Tests/4RTools.Tests.csproj

      - name: Build solution (Release)
        run: msbuild 4RTools.sln /p:Configuration=Release /p:Platform="Any CPU" /m

      - name: Run unit tests
        run: dotnet test tests/4RTools.Tests/4RTools.Tests.csproj --no-build -c Release --verbosity normal

      - name: Package Release assets
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "bin/Release/AureumRO 4Tools.exe" "dist/AureumRO 4Tools.exe"
          Compress-Archive -Path "dist/AureumRO 4Tools.exe" -DestinationPath "dist/AureumRO-4Tools-$tag.zip" -Force
          $exeHash = (Get-FileHash "dist/AureumRO 4Tools.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipHash = (Get-FileHash "dist/AureumRO-4Tools-$tag.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$zipHash  AureumRO-4Tools-$tag.zip"
            "$exeHash  AureumRO 4Tools.exe"
          ) | Set-Content -Path "dist/SHA256SUMS.txt" -Encoding UTF8

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $isPrerelease = $tag.Contains("-")
          $notes = @(
            ('Automated Windows Release build for **AureumRO 4Tools {0}** (desenvolvido por Oráculo).' -f $tag),
            '',
            '### Como executar / How to run',
            ('1. Download `AureumRO-4Tools-{0}.zip` (recomendado) ou `AureumRO 4Tools.exe`.' -f $tag),
            '2. Extraia e execute `AureumRO 4Tools.exe` (Windows 10/11 com .NET Framework 4.7.2+).',
            '3. Execute como Administrador caso o cliente do Ragnarok rode elevado.',
            '',
            '### SHA-256 Checksums',
            '```',
            (Get-Content "dist/SHA256SUMS.txt" -Raw).Trim(),
            '```'
          ) -join "`n"
          $notesPath = "dist/RELEASE_NOTES.md"
          Set-Content -Path $notesPath -Value $notes -Encoding UTF8

          $argsList = @(
            "release", "create", $tag,
            "dist/AureumRO-4Tools-$tag.zip",
            "dist/AureumRO 4Tools.exe",
            "dist/SHA256SUMS.txt",
            "--title", "AureumRO 4Tools $tag",
            "--notes-file", $notesPath
          )
          if ($isPrerelease) {
            $argsList += "--prerelease"
          }
          & gh @argsList
          if ($LASTEXITCODE -ne 0) {
            throw "gh release create failed with exit code $LASTEXITCODE"
          }
